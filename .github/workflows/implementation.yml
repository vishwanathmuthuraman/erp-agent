name: Implementation checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.13'
      - name: Install tested package manager
        run: python -m pip install uv==0.13.0
      - name: Install locked environment
        run: uv sync --locked
      - name: Check application formatting and lint
        run: |
          uv run --locked ruff check src tests
          uv run --locked ruff format --check src tests
      - name: Run behavioral tests
        run: uv run --locked pytest
      - name: Build and verify the installed wheel
        run: |
          uv build --wheel
          uv export --locked --no-emit-project --format requirements-txt --output-file .wheel-requirements.txt
          uv venv --python 3.12.13 .wheel-check
          uv pip install --python .wheel-check/bin/python --require-hashes -r .wheel-requirements.txt
          uv pip install --python .wheel-check/bin/python --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.wheel-check/bin/python" -m pytest -q "$GITHUB_WORKSPACE/tests"
